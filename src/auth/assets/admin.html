<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<title>AB2Pro — Administration</title>
<style>
:root { --paper:#f4f4f5; --card:#FFFFFF; --card2:#ececef; --ink:#29293b; --muted:#5f5f74;
  --line:#d9d9e0; --line-soft:#e8e8ee; --brass:#db303f; --brass-deep:#681316; --good:#47713E;
  --warn:#93660F; --warn-soft:#F1E6C8;
  --shadow:0 1px 2px rgba(60,50,20,.06), 0 4px 14px rgba(60,50,20,.07); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#1b1b25; --card:#232330; --card2:#2c2c3b; --ink:#ececf1; --muted:#a2a2b5;
  --line:#3b3b4d; --line-soft:#2f2f3e; --brass:#e85160; --brass-deep:#f0929c; --good:#93BD82;
  --warn:#D9B45E; --warn-soft:#383018;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3); } }
* { box-sizing: border-box; } html, body { margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px;
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header h1 { font-family: "Nexa", "Poppins", "Segoe UI", system-ui, sans-serif; font-size: 21px; margin: 0; } header h1 b { color: var(--brass); }
header .qui { margin-left: auto; color: var(--muted); font-size: 12.5px; }
header a { color: var(--brass-deep); }
.wrap { max-width: 1060px; margin: 0 auto; padding: 16px 20px 70px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); font-family: "Nexa", "Poppins", "Segoe UI", system-ui, sans-serif; }
.card .b { padding: 12px 16px 14px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 6px 6px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: 11.5px; }
.btn { border: 1px solid var(--line); background: var(--card2); color: var(--ink); border-radius: 6px;
  padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; margin: 1px 2px; }
.btn.p { background: var(--brass); border-color: var(--brass); color: #fff; }
.btn:hover { border-color: var(--brass); }
.tag { display: inline-block; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 0 8px; font-size: 11px; font-weight: 700; }
.tag.a { background: rgba(71,113,62,.15); color: var(--good); }
input, select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card2); color: var(--ink); font: inherit; font-size: 13px; }
.filtres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.note { font-size: 11.5px; color: var(--muted); }
.vide { color: var(--muted); font-size: 13px; padding: 6px 0; }
/* bascules d'accès par section (colonne Sections des utilisateurs) */
.secchip { display: inline-block; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px;
  font-size: 11px; font-weight: 600; margin: 1px 2px 1px 0; cursor: pointer; user-select: none;
  color: var(--muted); background: var(--card2); text-decoration: line-through; }
.secchip.on { color: var(--good); background: rgba(71,113,62,.12); border-color: var(--good); text-decoration: none; }
.cb-lig { font-size: 11.5px; white-space: nowrap; margin-right: 6px; }
.ed td { background: var(--card2); }
.edg { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; font-size: 12.5px; }
.edg label { display: flex; flex-direction: column; gap: 2px; font-weight: 600; color: var(--muted); }
.edg input, .edg select { padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; min-width: 150px; }
.edg .ed-ags { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.edg .ed-act { flex-basis: 100%; }
</style>
</head>
<body>
<header>
  <h1><b>AB2Pro</b> — Administration</h1>
  <span class="qui" id="qui"></span>
  <a href="/app/">→ Portail</a>
  <a href="#" id="btn-sortie">Déconnexion</a>
</header>

<div class="wrap">
  <section class="card">
    <h2>Demandes d'accès en attente</h2>
    <div class="b" id="z-demandes"><div class="vide">Chargement…</div></div>
  </section>

  <section class="card">
    <h2>Utilisateurs</h2>
    <div class="b" id="z-utilisateurs"><div class="vide">Chargement…</div></div>
  </section>

  <section class="card">
    <h2>Journal d'activité <span class="note">(500 dernières entrées)</span></h2>
    <div class="b">
      <div class="filtres">
        <input id="f-email" placeholder="Filtrer par e-mail…">
        <select id="f-type">
          <option value="">Tous les types</option>
          <option value="connexion">Connexions</option>
          <option value="connexion_echec">Échecs de connexion</option>
          <option value="page">Pages ouvertes</option>
          <option value="etude_prix">Études de prix (PDF)</option>
          <option value="impression_pdf">Impressions</option>
          <option value="solveur_net">Solveur de net</option>
          <option value="recherche">Recherches (IDCC/entreprises)</option>
          <option value="calcul_distance">Calculs de distance</option>
          <option value="demande_acces">Demandes d'accès</option>
          <option value="acces_refuse_section">Accès refusés (section)</option>
          <option value="admin_sections">Changements de sections</option>
        </select>
        <button class="btn p" id="btn-logs">Actualiser</button>
      </div>
      <div id="z-logs"><div class="vide">Chargement…</div></div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const post = (u, o) => fetch(u, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(o || {}) }).then(r => r.json());

let SUIS_SUPER = false;
/* accès par section : slugs + libellés courts (la liste de référence vient de /api/admin/apercu) */
let SECTIONS_APPS = ["simulateur", "paie", "conventions", "salaires-europe", "logements", "prestataires"];
const SEC_LIBELLES = { "simulateur": "Simulateur", "paie": "Veille Paie", "conventions": "Conventions", "salaires-europe": "Salaires E&M", "logements": "Logements", "prestataires": "Prestataires" };
const secLib = s => SEC_LIBELLES[s] || s;
/* sections ouvertes PAR DÉFAUT selon l'entité (décision direction 04/09) — l'admin peut en cocher d'autres */
const secDefaut = e => e === "prestataire" ? ["prestataires"] : e === "abservice" ? ["logements"] : ["simulateur", "paie", "conventions", "salaires-europe"];
const nomComplet = x => [x.prenom, x.nom].map(v => String(v || "").trim()).filter(Boolean).join(" ");
const escA = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const agArr = j => { try { const l = JSON.parse(j || "[]"); return Array.isArray(l) ? l : []; } catch (e) { return []; } };
const libAg = a => a.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("-");
function sectionsListe(brut, entite) {   // NULL / illisible = défaut de l'entité (même règle que le serveur)
  if (brut == null || brut === "") return secDefaut(entite);
  try { const l = JSON.parse(brut); return Array.isArray(l) ? l : secDefaut(entite); }
  catch (e) { return secDefaut(entite); }
}
/* agences AB Service (tableau JSON) -> libellé lisible */
function agListe(brut) {
  try { const l = JSON.parse(brut || "[]"); return Array.isArray(l) && l.length ? l.join(", ") : "(aucune agence)"; }
  catch (e) { return "(aucune agence)"; }
}
async function charger() {
  const moi = await fetch("/api/moi").then(r => r.ok ? r.json() : null);
  if (!moi) { location.href = "/"; return; }
  SUIS_SUPER = moi.role === "super_admin";
  $("qui").textContent = moi.email + (SUIS_SUPER ? " (super admin)" : " (admin)");
  const a = await fetch("/api/admin/apercu").then(r => r.json());
  if (Array.isArray(a.sections_apps) && a.sections_apps.length) SECTIONS_APPS = a.sections_apps;

  const zd = $("z-demandes");
  if (!a.demandes.length) zd.innerHTML = "<div class='vide'>Aucune demande en attente.</div>";
  else zd.innerHTML = "<table><tr><th>Date</th><th>Nom</th><th>E-mail</th><th>Entité · agences</th><th>Fonction</th><th>Sections ouvertes</th><th></th></tr>" +
    a.demandes.map(d => "<tr><td>" + esc(d.cree_le) + "</td><td>" + esc(nomComplet(d)) + "</td><td>" + esc(d.email) +
      "</td><td>" + (d.entite === "abservice" ? "<b>AB SERVICE</b><br>" + esc(agListe(d.agences))
        : d.entite === "prestataire" ? "<b>PRESTATAIRE</b><br>" + esc(d.societe || "") + " · " + esc(d.pays || "") + " · " + esc(d.telephone || "") + " · langue " + esc(d.langue || "fr")
        : "AB2PRO") +
      "</td><td>" + esc(d.fonction || d.motif || "") + "</td><td>" +
      SECTIONS_APPS.map(s => "<label class='cb-lig'><input type='checkbox' class='cb-sec' data-dem='" + d.id +
        "' value='" + s + "'" + (secDefaut(d.entite).includes(s) ? " checked" : "") + "> " + esc(secLib(s)) + "</label>").join("") + "</td><td>" +
      "<button class='btn p' data-app='" + d.id + "'>Approuver</button>" +
      (SUIS_SUPER ? "<button class='btn' data-appadm='" + d.id + "'>Approuver admin</button>" : "") +
      "<button class='btn' data-ref='" + d.id + "'>Refuser</button></td></tr>").join("") + "</table>" +
    "<p class='note'>Sections pré-cochées = défaut de l'entité (AB2PRO : outils internes · AB Service : logements · Prestataire : son espace). Cochez-en d'autres AVANT d'approuver si besoin (un admin approuvé a toujours accès à tout) ; modifiable ensuite dans la colonne Sections.</p>";
  zd.querySelectorAll("[data-app]").forEach(b => b.onclick = () => approuver(b.dataset.app, "user"));
  zd.querySelectorAll("[data-appadm]").forEach(b => b.onclick = () => approuver(b.dataset.appadm, "admin"));
  zd.querySelectorAll("[data-ref]").forEach(b => b.onclick = async () => { await post("/api/admin/refuser", { id: +b.dataset.ref }); charger(); });

  const zu = $("z-utilisateurs");
  zu.innerHTML = "<table><tr><th>E-mail</th><th>Nom</th><th>Entité · agences</th><th>Rôle</th><th>Sections</th><th>État</th><th>Créé</th><th></th></tr>" +
    a.utilisateurs.map(x => {
      const sup = x.role === "super_admin", adm = x.role === "admin";
      /* colonne Sections : bascules cliquables pour les utilisateurs simples, « toutes » pour les admins */
      const secs = sectionsListe(x.sections, x.entite);
      const colSecs = (sup || adm) ? "<span class='note'>toutes</span>" :
        SECTIONS_APPS.map(s => "<span class='secchip" + (secs.includes(s) ? " on" : "") + "' data-uid='" + x.id +
          "' data-sec='" + s + "' title='Cliquer pour ouvrir/fermer'>" + esc(secLib(s)) + "</span>").join("");
      /* super admin : intouchable (réinvitation possible par un autre super admin uniquement).
         admin : gérable uniquement par un super admin. user : gérable par tout admin. */
      let boutons = "";
      if (sup) {
        boutons = SUIS_SUPER ? "<button class='btn' data-inv='" + x.id + "'>Réinviter</button>" : "<span class='note'>intouchable</span>";
      } else if (adm) {
        boutons = SUIS_SUPER
          ? "<button class='btn' data-role='" + x.id + "' data-vers='user'>Rétrograder</button>" +
            "<button class='btn' data-actif='" + x.id + "' data-vers='" + (x.actif ? 0 : 1) + "'>" + (x.actif ? "Désactiver" : "Réactiver") + "</button>" +
            "<button class='btn' data-inv='" + x.id + "'>Réinviter</button>"
          : "<span class='note'>géré par les super admins</span>";
      } else {
        boutons = (SUIS_SUPER ? "<button class='btn' data-role='" + x.id + "' data-vers='admin'>Promouvoir admin</button>" : "") +
          "<button class='btn' data-actif='" + x.id + "' data-vers='" + (x.actif ? 0 : 1) + "'>" + (x.actif ? "Désactiver" : "Réactiver") + "</button>" +
          "<button class='btn' data-inv='" + x.id + "'>Réinviter</button>";
      }
      /* fiche : toutes les infos modifiables par un admin (cibles admin/super admin : super admins seulement, soi-même toujours) */
      const peutEditer = (!sup && !adm) || SUIS_SUPER || x.email === moi.email;
      if (peutEditer) boutons += "<button class='btn' data-edit='" + x.id + "'>Modifier</button>";
      const agOpts = (a.agences_abservice || []).map(ag => "<label class='cb-lig'><input type='checkbox' class='ed-ag' value='" + escA(ag) + "'" +
        (agArr(x.agences).includes(ag) ? " checked" : "") + "> " + escA(libAg(ag)) + "</label>").join("");
      const editeur = !peutEditer ? "" : "<tr class='ed' data-ed='" + x.id + "' hidden><td colspan='8'><div class='edg'>" +
        "<label>Prénom<input data-k='prenom' value=\"" + escA(x.prenom || "") + "\"></label>" +
        "<label>Nom<input data-k='nom' value=\"" + escA(x.nom || "") + "\"></label>" +
        "<label>E-mail de connexion<input data-k='email' type='email' value=\"" + escA(x.email) + "\"></label>" +
        "<label>Fonction<input data-k='fonction' value=\"" + escA(x.fonction || "") + "\"></label>" +
        "<label>Entité<select data-k='entite'>" + ["ab2pro", "abservice", "prestataire"].map(e => "<option value='" + e + "'" + ((x.entite || "ab2pro") === e ? " selected" : "") + ">" + e.toUpperCase() + "</option>").join("") + "</select></label>" +
        "<label>Langue<select data-k='langue'>" + ["fr", "en", "ro", "hu"].map(l => "<option" + ((x.langue || "fr") === l ? " selected" : "") + ">" + l + "</option>").join("") + "</select></label>" +
        "<div class='ed-ags'" + (x.entite === "abservice" ? "" : " hidden") + "><span class='note'>Agences AB Service (au moins une) :</span> " + agOpts + "</div>" +
        "<div class='ed-act'><button class='btn p' data-save='" + x.id + "'>Enregistrer</button> <button class='btn' data-cancel='" + x.id + "'>Annuler</button> <span class='note' data-edmsg='" + x.id + "'></span></div>" +
        "</div></td></tr>";
      return "<tr><td>" + esc(x.email) + "</td><td>" + esc(nomComplet(x)) + (x.langue && x.langue !== "fr" ? " <span class='note'>(" + esc(x.langue) + ")</span>" : "") + "</td>" +
        "<td>" + (x.entite === "abservice" ? "<b>AB SERVICE</b><br><span class='note'>" + esc(agListe(x.agences)) + "</span>" : x.entite === "prestataire" ? "<b>PRESTATAIRE</b>" : "AB2PRO") + "</td>" +
        "<td>" + (sup ? "<span class='tag a'>★ super admin</span>" : adm ? "<span class='tag a'>admin</span>" : "user") + "</td>" +
        "<td>" + colSecs + "</td>" +
        "<td>" + (x.actif ? (x.doit_changer_mdp ? "<span class='tag'>invitation en cours</span>" : "actif") : "<span class='tag'>désactivé</span>") + "</td>" +
        "<td>" + esc((x.cree_le || "").slice(0, 10)) + " <span class='note'>par " + esc(x.cree_par) + "</span></td><td>" +
        boutons + "</td></tr>" + editeur;
    }).join("") + "</table>";
  const messages = { pas_soi_meme: "On ne modifie pas son propre compte.",
    intouchable: "Les super admins sont intouchables : ni rétrogradation, ni désactivation, jamais.",
    reserve_super_admin: "Action réservée aux super admins.",
    nom_requis: "le nom est obligatoire", email_invalide: "adresse e-mail invalide", email_deja_utilise: "cette adresse est déjà utilisée par un autre compte",
    entite_invalide: "entité invalide", agences_invalides: "AB Service : choisir au moins une agence", langue_invalide: "langue invalide" };
  /* éditeur de fiche : ouvrir/fermer, agences visibles si AB Service, enregistrement → /api/admin/utilisateur */
  zu.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { const tr = zu.querySelector("tr.ed[data-ed='" + b.dataset.edit + "']"); tr.hidden = !tr.hidden; });
  zu.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => { zu.querySelector("tr.ed[data-ed='" + b.dataset.cancel + "']").hidden = true; });
  zu.querySelectorAll("tr.ed select[data-k='entite']").forEach(sel => sel.onchange = () => { sel.closest("tr.ed").querySelector(".ed-ags").hidden = sel.value !== "abservice"; });
  zu.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
    const tr = b.closest("tr.ed"); const o = { id: +b.dataset.save };
    tr.querySelectorAll("[data-k]").forEach(e => { o[e.dataset.k] = e.value; });
    o.agences = [...tr.querySelectorAll(".ed-ag:checked")].map(c => c.value);
    const msg = tr.querySelector("[data-edmsg]"); msg.textContent = "Enregistrement…";
    const j = await post("/api/admin/utilisateur", o);
    if (j.ok) charger(); else msg.textContent = "Erreur : " + (messages[j.erreur] || j.erreur || "inconnue");
  });
  zu.querySelectorAll("[data-role]").forEach(b => b.onclick = async () => {
    const j = await post("/api/admin/role", { id: +b.dataset.role, role: b.dataset.vers });
    if (messages[j.erreur]) alert(messages[j.erreur]); charger(); });
  zu.querySelectorAll("[data-actif]").forEach(b => b.onclick = async () => {
    const j = await post("/api/admin/actif", { id: +b.dataset.actif, actif: +b.dataset.vers });
    if (messages[j.erreur]) alert(messages[j.erreur]); charger(); });
  zu.querySelectorAll("[data-inv]").forEach(b => b.onclick = async () => {
    const j = await post("/api/admin/reinviter", { id: +b.dataset.inv });
    alert(j.ok ? "Invitation renvoyée par e-mail.\nLien direct (si besoin) : " + j.lien : "Erreur."); });
  /* bascule d'une section : on lit l'état des chips de la ligne APRÈS bascule et on enregistre */
  zu.querySelectorAll(".secchip").forEach(ch => ch.onclick = async () => {
    ch.classList.toggle("on");
    const uid = +ch.dataset.uid;
    const secs = [...zu.querySelectorAll(".secchip.on")].filter(c => +c.dataset.uid === uid).map(c => c.dataset.sec);
    const j = await post("/api/admin/sections", { id: uid, sections: secs });
    if (!j.ok) { alert("Erreur : " + (j.erreur || "inconnue")); charger(); }
  });
}

async function approuver(id, role) {
  const sections = [...document.querySelectorAll(".cb-sec")]
    .filter(c => +c.dataset.dem === +id && c.checked).map(c => c.value);
  const j = await post("/api/admin/approuver", { id: +id, role: role, sections: sections });
  if (j.ok) alert("Accès " + (role === "admin" ? "ADMIN " : "") + "approuvé — l'utilisateur a reçu son lien par e-mail.\nLien direct (si besoin) : " + j.lien);
  else alert("Erreur : " + (j.erreur || "inconnue"));
  charger();
}

async function chargerLogs() {
  const q = new URLSearchParams();
  if ($("f-email").value) q.set("email", $("f-email").value);
  if ($("f-type").value) q.set("type", $("f-type").value);
  const j = await fetch("/api/admin/logs?" + q).then(r => r.json());
  /* études de prix : le détail est un JSON {resume, s} — résumé chiffré + lien qui rouvre la
     simulation de l'utilisateur telle quelle dans le simulateur (même mécanisme que « Partager ») */
  const detailHTML = l => {
    if (l.type === "etude_prix") {
      try {
        const d = JSON.parse(l.details);
        if (d && d.resume !== undefined) {
          let s = esc(d.resume || "");
          if (d.s && /^#s=[A-Za-z0-9%._-]+$/.test(d.s))
            s += " <a href='/app/simulateur.html" + d.s + "' target='_blank' rel='noopener'><b>ouvrir la simulation →</b></a>";
          return s;
        }
      } catch (e) { /* ancien format : texte brut */ }
    }
    return esc(l.details);
  };
  $("z-logs").innerHTML = !j.logs.length ? "<div class='vide'>Aucune entrée.</div>" :
    "<table><tr><th>Horodatage (UTC)</th><th>Utilisateur</th><th>Action</th><th>Détails</th><th>Page</th><th>IP</th></tr>" +
    j.logs.map(l => "<tr><td>" + esc(l.ts) + "</td><td>" + esc(l.email || "—") + "</td><td>" + esc(l.type) +
      "</td><td>" + detailHTML(l) + "</td><td>" + esc(l.page) + "</td><td class='note'>" + esc(l.ip) + "</td></tr>").join("") + "</table>";
}

$("btn-logs").onclick = chargerLogs;
$("btn-sortie").onclick = async e => { e.preventDefault(); await post("/api/logout"); location.href = "/"; };
charger(); chargerLogs();
</script>
</body>
</html>
