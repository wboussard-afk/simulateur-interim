<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<title>AB2Pro — Mot de passe</title>
<style>
:root { --paper:#f4f4f5; --card:#FFFFFF; --card2:#ececef; --ink:#29293b; --muted:#5f5f74;
  --line:#d9d9e0; --brass:#db303f; --brass-deep:#681316;
  --shadow:0 1px 2px rgba(60,50,20,.06), 0 4px 14px rgba(60,50,20,.07); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#1b1b25; --card:#232330; --card2:#2c2c3b; --ink:#ececf1; --muted:#a2a2b5;
  --line:#3b3b4d; --brass:#e85160; --brass-deep:#f0929c;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3); } }
* { box-sizing: border-box; } html, body { margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; }
.boite { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 26px 24px; }
h1 { font-family: "Nexa", "Poppins", "Segoe UI", system-ui, sans-serif; font-size: 21px; margin: 0 0 14px; text-align: center; }
h1 b { color: var(--brass); }
label { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; margin: 12px 0 3px; }
input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--card2); color: var(--ink); font: inherit; }
button { width: 100%; margin-top: 16px; padding: 11px; border: none; border-radius: 7px;
  background: var(--brass); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
.msg { margin-top: 12px; font-size: 13px; text-align: center; min-height: 18px; }
.msg.err { color: var(--brass-deep); } .note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="boite">
  <h1><b>AB2Pro</b> — <span data-t="titre">Définir le mot de passe</span></h1>
  <form id="f">
    <div id="bloc-ancien">
      <label data-t="ancien">Mot de passe actuel (ou temporaire)</label>
      <input id="ancien" type="password" autocomplete="current-password">
    </div>
    <label data-t="nouveau">Nouveau mot de passe (10 caractères minimum)</label>
    <input id="n1" type="password" autocomplete="new-password" required minlength="10">
    <label data-t="confirmer">Confirmez</label>
    <input id="n2" type="password" autocomplete="new-password" required>
    <button type="submit" data-t="valider">Enregistrer et entrer</button>
    <div class="msg" id="msg"></div>
    <div class="note" data-t="conseil">Conseil : une phrase de passe (3-4 mots) est plus sûre et plus simple à retenir.</div>
  </form>
</div>
<script>
const $ = id => document.getElementById(id);
/* page traduite FR/EN/RO/HU : langue = ?l= du lien d'invitation, sinon choix mémorisé sur la page de connexion, sinon navigateur */
const T = {
  fr: { titre: "Définir le mot de passe", ancien: "Mot de passe actuel (ou temporaire)", nouveau: "Nouveau mot de passe (10 caractères minimum)", confirmer: "Confirmez", valider: "Enregistrer et entrer",
    conseil: "Conseil : une phrase de passe (3-4 mots) est plus sûre et plus simple à retenir.", differe: "Les deux saisies diffèrent.", enreg: "Enregistrement…",
    invitation_invalide: "Lien d'invitation expiré — demandez une réinvitation à un administrateur.", ancien_incorrect: "Mot de passe actuel incorrect.", mot_de_passe_trop_court: "10 caractères minimum.", erreur: "Erreur — réessayez.", reseau: "Connexion au serveur impossible — vérifiez votre réseau et réessayez." },
  en: { titre: "Set your password", ancien: "Current (or temporary) password", nouveau: "New password (at least 10 characters)", confirmer: "Confirm", valider: "Save and enter",
    conseil: "Tip: a passphrase of 3-4 words is safer and easier to remember.", differe: "The two entries differ.", enreg: "Saving…",
    invitation_invalide: "Invitation link expired — ask an administrator to send a new one.", ancien_incorrect: "Current password is incorrect.", mot_de_passe_trop_court: "At least 10 characters.", erreur: "Error — please try again.", reseau: "Cannot reach the server — check your connection and try again." },
  ro: { titre: "Setați parola", ancien: "Parola actuală (sau temporară)", nouveau: "Parolă nouă (minimum 10 caractere)", confirmer: "Confirmați", valider: "Salvați și intrați",
    conseil: "Sfat: o frază de 3-4 cuvinte este mai sigură și mai ușor de reținut.", differe: "Cele două parole diferă.", enreg: "Se salvează…",
    invitation_invalide: "Linkul de invitație a expirat — cereți unui administrator o nouă invitație.", ancien_incorrect: "Parola actuală este incorectă.", mot_de_passe_trop_court: "Minimum 10 caractere.", erreur: "Eroare — reîncercați.", reseau: "Nu se poate contacta serverul — verificați conexiunea și reîncercați." },
  hu: { titre: "Jelszó beállítása", ancien: "Jelenlegi (vagy ideiglenes) jelszó", nouveau: "Új jelszó (legalább 10 karakter)", confirmer: "Megerősítés", valider: "Mentés és belépés",
    conseil: "Tipp: egy 3-4 szóból álló jelmondat biztonságosabb és könnyebben megjegyezhető.", differe: "A két jelszó nem egyezik.", enreg: "Mentés…",
    invitation_invalide: "A meghívó link lejárt — kérjen új meghívót egy adminisztrátortól.", ancien_incorrect: "A jelenlegi jelszó hibás.", mot_de_passe_trop_court: "Legalább 10 karakter.", erreur: "Hiba — próbálja újra.", reseau: "A szerver nem érhető el — ellenőrizze a kapcsolatot, és próbálja újra." },
};
const LANGUES = ["fr", "en", "ro", "hu"];
const params = new URLSearchParams(location.search);
let L = params.get("l"); if (!LANGUES.includes(L)) { try { L = localStorage.getItem("ab2pro_langue"); } catch (e) { L = null; } }
if (!LANGUES.includes(L)) { const nav = String(navigator.language || "").slice(0, 2).toLowerCase(); L = LANGUES.includes(nav) ? nav : "fr"; }
try { localStorage.setItem("ab2pro_langue", L); } catch (e) {}
const t = k => (T[L] && T[L][k]) || T.fr[k] || k;
document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
document.documentElement.lang = L; document.title = "AB2Pro — " + t("titre");
const invite = params.get("invite");
if (invite) $("bloc-ancien").hidden = true;
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("msg"); m.className = "msg";
  if ($("n1").value !== $("n2").value) { m.className = "msg err"; m.textContent = t("differe"); return; }
  m.textContent = t("enreg");
  const corps = { nouveau: $("n1").value };
  if (invite) corps.invite = invite; else corps.ancien = $("ancien").value;
  let r;
  try { r = await fetch("/api/motdepasse", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(corps) }); }
  catch (err) { m.className = "msg err"; m.textContent = t("reseau"); return; }
  const j = await r.json().catch(() => ({}));
  if (r.ok && j.ok) location.href = "/app/";
  else { m.className = "msg err"; m.textContent = t(T.fr[j.erreur] ? j.erreur : "erreur"); }
});
</script>
</body>
</html>
